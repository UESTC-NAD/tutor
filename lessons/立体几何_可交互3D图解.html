<style>

<body>
<div class="wrap">
<h1>立体几何 · 可交互 3D 图解</h1>
<div class="sub">模块质量检测(二) 第 8、11、16、19 题 &nbsp;·&nbsp; 拖动旋转 &nbsp;|&nbsp; 滚轮缩放 &nbsp;|&nbsp; 勾选开关辅助线</div>

<div class="tabs" id="tabs"></div>
<div class="qname" id="qname"></div>

<div class="stage">
  <div class="canvasbox">
    <canvas id="cv"></canvas>
    <div class="hint">按住拖动旋转 · 滚轮/双指缩放 · 右键拖动平移</div>
  </div>

    <h3>辅助线开关</h3>
    <div id="groups"></div>
    <div class="btns">
      <button class="btn" id="btnAll">全开</button>
      <button class="btn" id="btnNone">全关</button>
      <button class="btn" id="btnSpin">自动旋转</button>
      <button class="btn" id="btnReset">重置视角</button>
    </div>
    <div class="slider" id="sliderBox" style="display:none">
      <label>二面角 C-AE-B：<b id="angVal">60°</b>
      <input type="range" id="ang" min="0" max="90" value="60" step="1"></label>
    </div>
    <div class="facts" id="facts"></div>
  </div>
</div>

<script>
/* ============ 极简 3D 渲染器（正交投影 + 画家算法） ============ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cam={yaw:-0.75,pitch:0.42,scale:1,panx:0,pany:0}, DEF={yaw:-0.75,pitch:0.42,scale:1,panx:0,pany:0};
let spin=false;

function resize(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize',resize);

function tr(p){ // 世界坐标 -> {sx, sy, depth}
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const x1=p[0]*cy - p[1]*sy, y1=p[0]*sy + p[1]*cy, z1=p[2];
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  return {sx:x1, sy:-(z1*cp - y1*sp), d:(y1*cp + z1*sp)};
}
let VIEW={cx:0,cy:0,S:60}, ORIG=[0,0,0];
function proj(p){const t=tr([p[0]-ORIG[0],p[1]-ORIG[1],p[2]-ORIG[2]]);
  return[VIEW.cx+t.sx*VIEW.S+cam.panx, VIEW.cy+t.sy*VIEW.S+cam.pany, t.d];}
function fitScene(s){                       // 自动居中 + 自动缩放
  let lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9];
  const add=p=>{for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i]);}};
  s.faces.forEach(f=>f.p.forEach(add)); s.lines.forEach(l=>{add(l.a);add(l.b);});
  s.polys.forEach(q=>q.p.forEach(add)); s.pts.forEach(q=>add(q.p)); s.labels.forEach(q=>add(q.p));
  s.spheres.forEach(b=>{add([b.c[0]-b.r,b.c[1]-b.r,b.c[2]-b.r]);add([b.c[0]+b.r,b.c[1]+b.r,b.c[2]+b.r]);});
  s.center=[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2,(lo[2]+hi[2])/2];
  s.rad=Math.max(0.5,Math.hypot(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2])/2);
  return s;
}

/* ============ 场景定义 ============ */
const V=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const ADD=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const MUL=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const MID=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
const CROSS=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const NORM=a=>{const l=Math.hypot(...a);return[a[0]/l,a[1]/l,a[2]/l];};

const C={main:'#1b6b6b',aux:'#b4552b',aux2:'#2e8b57',aux3:'#6b4fa8',faint:'#8fa3a0'};

function circle3d(center,normal,r,seg=96){
  const n=NORM(normal);
  let u=Math.abs(n[0])<0.9?CROSS(n,[1,0,0]):CROSS(n,[0,1,0]);
  u=NORM(u); const v=CROSS(n,u); const pts=[];
  for(let i=0;i<=seg;i++){const t=i/seg*Math.PI*2;
    pts.push(ADD(center,ADD(MUL(u,r*Math.cos(t)),MUL(v,r*Math.sin(t)))));}
  return pts;
}

/* ---------- 第 8 题：正四面体 + 外接球 ---------- */
function scene8(){
  const k=Math.sqrt(1.5);                    // 棱长 a=2√3
  const A=[k,k,k],B=[k,-k,-k],Cc=[-k,k,-k],D=[-k,-k,k];
  const O=[0,0,0], E=MID(A,B);
  const s={verts:{A,B,C:Cc,D,O,E},faces:[],lines:[],polys:[],spheres:[],pts:[],labels:[],groups:{}};
  s.faces.push({p:[A,B,Cc],c:'rgba(27,107,107,.16)'},{p:[A,B,D],c:'rgba(27,107,107,.16)'},
               {p:[A,Cc,D],c:'rgba(27,107,107,.12)'},{p:[B,Cc,D],c:'rgba(27,107,107,.10)'});
  [[A,B],[A,Cc],[A,D],[B,Cc],[B,D],[Cc,D]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.main,w:2.2}));
  s.lines.push({a:O,b:E,c:C.aux,w:2,g:'oe'},{a:A,b:B,c:C.aux,w:3,g:'oe'});
  s.polys.push({p:circle3d(E,V(E,O),Math.sqrt(3)),c:C.aux2,w:2.4,g:'sec',fill:'rgba(46,139,87,.13)'});
  s.spheres.push({c:O,r:Math.sqrt(4.5),col:'rgba(180,85,43,.75)',fill:'rgba(180,85,43,.05)',g:'ball'});
  s.pts=[{p:E,c:C.aux},{p:O,c:C.aux}];
  s.labels=[{p:A,t:'A'},{p:B,t:'B'},{p:Cc,t:'C'},{p:D,t:'D'},
            {p:E,t:'E',c:C.aux},{p:O,t:'O',c:C.aux}];
  s.groups={ball:['外接球 O（R=3√2⁄2）',C.aux,1],oe:['棱 AB 与 OE（OE=√6⁄2）',C.aux,1],
            sec:['过 E 的最小截面圆（r=√3）',C.aux2,1]};
  s.facts=`棱长 <b>a=2√3</b>（由 V=√2a³⁄12=2√6）。外接球半径 <b>R=3√2⁄2</b>；
    E 为 AB 中点 ⟹ OE⊥AB，<b>OE=√6⁄2</b>。
    <ul><li>平面过定点 E，到球心距离 d≤OE；</li>
    <li>当平面 <b>⊥ OE</b> 时 d 最大 ⟹ 截面圆最小；</li>
    <li>r<sub>min</sub>=√(R²−OE²)=√3，S=<b>3π</b>。转动看：绿圈始终垂直于橙色的 OE。</li></ul>`;
  return fitScene(s);
}

/* ---------- 第 11 题：正四棱锥 ---------- */
function scene11(){
  const A=[-1,-1,0],B=[1,-1,0],Cc=[1,1,0],D=[-1,1,0],P=[0,0,Math.SQRT2],O=[0,0,0];
  const E=MID(A,B),F=MID(B,Cc),G=MID(P,B);
  const s={faces:[],lines:[],polys:[],spheres:[],pts:[],labels:[],groups:{}};
  s.faces.push({p:[A,B,Cc,D],c:'rgba(27,107,107,.13)'},{p:[P,A,B],c:'rgba(27,107,107,.16)'},
               {p:[P,B,Cc],c:'rgba(27,107,107,.13)'},{p:[P,Cc,D],c:'rgba(27,107,107,.10)'},
               {p:[P,D,A],c:'rgba(27,107,107,.10)'});
  [[A,B],[B,Cc],[Cc,D],[D,A],[P,A],[P,B],[P,Cc],[P,D]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.main,w:2.2}));
  s.faces.push({p:[G,E,F],c:'rgba(180,85,43,.22)',g:'gef'});
  [[G,E],[E,F],[F,G]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.aux,w:2.4,g:'gef'}));
  s.faces.push({p:[P,A,Cc],c:'rgba(46,139,87,.22)',g:'pac'});
  [[P,A],[A,Cc],[Cc,P]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.aux2,w:2.4,g:'pac'}));
  s.lines.push({a:D,b:G,c:C.aux3,w:2.6,g:'dg'},{a:E,b:F,c:C.aux3,w:2.6,g:'dg'});
  s.lines.push({a:P,b:O,c:C.faint,w:1.8,dash:[5,4],g:'po'});
  s.spheres.push({c:O,r:Math.SQRT2,col:'rgba(180,85,43,.6)',fill:'rgba(180,85,43,.04)',g:'ball'});
  s.pts=[{p:E,c:C.aux},{p:F,c:C.aux},{p:G,c:C.aux},{p:O,c:C.faint,g:'po'}];
  s.labels=[{p:P,t:'P'},{p:A,t:'A'},{p:B,t:'B'},{p:Cc,t:'C'},{p:D,t:'D'},
            {p:E,t:'E',c:C.aux},{p:F,t:'F',c:C.aux},{p:G,t:'G',c:C.aux},{p:O,t:'O',c:C.faint,g:'po'}];
  s.groups={gef:['平面 GEF（选项 A）',C.aux,1],pac:['平面 PAC（选项 A）',C.aux2,1],
            dg:['EF 与 DG（选项 B）',C.aux3,1],po:['高 PO=√2',C.faint,1],
            ball:['外接球（球心即 O，R=√2）',C.aux,0]};
  s.facts=`各棱长均为 2 ⟹ AO=√2，<b>PO=√2</b>。
    <ul><li><b>A 对</b>：EF∥AC、EG∥PA ⟹ 面 GEF∥面 PAC（同时打开橙、绿两个面，转动可见两面始终平行）；</li>
    <li><b>B 对</b>：EF·DG=0 ⟹ EF⊥DG；</li>
    <li><b>C 错</b>：V<sub>P-AGC</sub>=½V<sub>P-ABC</sub>=√2⁄3，不是 2⁄3；</li>
    <li><b>D 对</b>：球心恰为底面中心 O，R=√2 ⟹ S=8π（打开"外接球"，5 个顶点都在球面上）。</li></ul>`;
  return fitScene(s);
}

/* ---------- 第 16 题 ---------- */
function scene16(){
  const A=[0,0,0],B=[1,0,0],Cc=[1,2,0],D=[0,1,0],E=[0,0,2];
  const F=MID(Cc,E), G=MID(B,E);
  const n=NORM([2,2,1]); const H=ADD(Cc,MUL(n,-4/3));
  const s={faces:[],lines:[],polys:[],spheres:[],pts:[],labels:[],groups:{}};
  s.faces.push({p:[A,B,Cc,D],c:'rgba(27,107,107,.14)'},{p:[E,A,B],c:'rgba(27,107,107,.16)'},
               {p:[E,B,Cc],c:'rgba(27,107,107,.11)'},{p:[E,Cc,D],c:'rgba(27,107,107,.09)'},
               {p:[E,D,A],c:'rgba(27,107,107,.12)'});
  [[A,B],[B,Cc],[Cc,D],[D,A],[E,A],[E,B],[E,Cc],[E,D]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.main,w:2.2}));
  s.lines.push({a:D,b:F,c:C.aux,w:2.6,g:'df'},{a:A,b:G,c:C.aux,w:2.6,g:'df'},
               {a:F,b:G,c:C.aux,w:1.8,dash:[5,4],g:'df'},{a:A,b:D,c:C.aux,w:1.8,dash:[5,4],g:'df'});
  s.faces.push({p:[B,D,E],c:'rgba(46,139,87,.25)',g:'bde'});
  [[B,D],[D,E],[E,B]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.aux2,w:2.4,g:'bde'}));
  s.lines.push({a:Cc,b:H,c:C.aux3,w:2.6,dash:[6,4],g:'dist'});
  s.lines.push({a:A,b:[2.2,0,0],c:'#c9a227',w:1.4,dash:[4,4],g:'axes'},
               {a:A,b:[0,2.6,0],c:'#c9a227',w:1.4,dash:[4,4],g:'axes'},
               {a:A,b:[0,0,2.6],c:'#c9a227',w:1.4,dash:[4,4],g:'axes'});
  s.pts=[{p:F,c:C.aux},{p:G,c:C.aux},{p:H,c:C.aux3,g:'dist'}];
  s.labels=[{p:A,t:'A'},{p:B,t:'B'},{p:Cc,t:'C'},{p:D,t:'D'},{p:E,t:'E'},
            {p:F,t:'F',c:C.aux},{p:G,t:'G',c:C.aux},{p:H,t:'H',c:C.aux3,g:'dist'},
            {p:[2.35,0,0],t:'x',c:'#c9a227',g:'axes'},{p:[0,2.75,0],t:'y',c:'#c9a227',g:'axes'},{p:[0,0,2.8],t:'z',c:'#c9a227',g:'axes'}];
  s.groups={df:['DF∥AG（G 为 BE 中点，ADFG 为平行四边形）',C.aux,1],
            bde:['平面 BDE',C.aux2,1],
            dist:['C 到平面 BDE 的垂线段（=4⁄3）',C.aux3,1],
            axes:['坐标轴 A-xyz','#c9a227',0]};
  s.facts=`AE⊥底面，AD⊥AB，AB=AD=1，AE=BC=2，F 为 CE 中点。
    <ul><li><b>(1)</b> 取 BE 中点 G：FG∥BC 且 FG=1=AD ⟹ ADFG 为平行四边形 ⟹ <b>DF∥AG</b>⊂面 EAB；</li>
    <li><b>(2)</b> 等体积：V<sub>E-BCD</sub>=2⁄3，S<sub>△BDE</sub>=3⁄2 ⟹ d=<b>4⁄3</b>（紫色垂线段，垂足 H 在平面 BDE 所在平面上）。</li></ul>`;
  return fitScene(s);
}

/* ---------- 第 19 题：翻折（可调二面角） ---------- */
let fold=60;
function scene19(){
  const th=fold*Math.PI/180;
  const E=[0,0,0],B=[2,0,0],A=[0,0,2];
  const Cc=[2*Math.cos(th),2*Math.sin(th),0], D=ADD(Cc,[0,0,1]);
  const G=MID(A,B), M=MID(B,E), F=ADD(B,MUL(V(E,B),0.25));
  const s={faces:[],lines:[],polys:[],spheres:[],pts:[],labels:[],groups:{}};
  s.faces.push({p:[A,E,B],c:'rgba(27,107,107,.17)'},{p:[E,B,Cc],c:'rgba(27,107,107,.12)'},
               {p:[A,E,Cc,D],c:'rgba(200,150,60,.20)'},
               {p:[A,D,B],c:'rgba(27,107,107,.08)'},{p:[D,Cc,B],c:'rgba(27,107,107,.08)'});
  [[A,E],[E,B],[A,B],[E,Cc],[Cc,B],[A,D],[D,Cc],[D,B],[A,Cc]]
    .forEach((e,i)=>s.lines.push({a:e[0],b:e[1],c:C.main,w:i>=7?1.6:2.2,dash:i>=7?[5,4]:null}));
  s.lines.push({a:D,b:G,c:C.aux2,w:3,g:'dg'},{a:Cc,b:M,c:C.aux2,w:2,dash:[6,4],g:'dg'},
               {a:G,b:M,c:C.aux2,w:1.6,dash:[4,4],g:'dg'},{a:D,b:Cc,c:C.aux2,w:1.6,dash:[4,4],g:'dg'});
  s.faces.push({p:[A,F,D],c:'rgba(180,85,43,.24)',g:'af'});
  [[A,F],[F,D],[A,D]].forEach(e=>s.lines.push({a:e[0],b:e[1],c:C.aux,w:2.4,g:'af'}));
  s.lines.push({a:F,b:B,c:C.aux,w:3,g:'af'});
  s.polys.push({p:circle3d(E,[0,0,1],0.55,64).filter((p,i)=>{
      const a=Math.atan2(p[1],p[0]); return a>=-0.02&&a<=th+0.02;}),
      c:C.aux3,w:2,g:'ang'});
  s.lines.push({a:E,b:[2.4,0,0],c:C.aux3,w:1.2,dash:[4,4],g:'ang'},
               {a:E,b:MUL([Math.cos(th),Math.sin(th),0],2.4),c:C.aux3,w:1.2,dash:[4,4],g:'ang'});
  s.pts=[{p:G,c:C.aux2},{p:M,c:C.aux2,g:'dg'},{p:F,c:C.aux}];
  s.labels=[{p:A,t:'A'},{p:B,t:'B'},{p:E,t:'E'},{p:Cc,t:'C'},{p:D,t:'D'},
            {p:G,t:'G',c:C.aux2},{p:M,t:'M',c:C.aux2,g:'dg'},{p:F,t:'F',c:C.aux},
            {p:MUL([Math.cos(th/2),Math.sin(th/2),0],0.95),t:fold+'°',c:C.aux3,g:'ang'}];
  s.groups={dg:['DG∥CM ⊥ 平面 ABE（第 1 问）',C.aux2,1],
            af:['二面角 D-AF-B（第 2 问）',C.aux,1],
            ang:['二面角 C-AE-B 的平面角 ∠BEC',C.aux3,1]};
  s.facts=`拖动滑块看折叠过程：<b>AE⊥EB、AE⊥EC 始终成立</b>，所以 AE⊥平面 BEC，∠BEC 就是二面角 C-AE-B。
    <ul><li>取 BE 中点 M：MG∥＝CD ⟹ <b>DG∥CM</b>；θ=60° 时 △BEC 为等边三角形 ⟹ CM⊥EB，又 CM⊥AE ⟹ <b>DG⊥平面 ABE</b>；</li>
    <li>把滑块拉到 60° 观察：绿色 DG 恰好垂直于灰蓝色的 △ABE；</li>
    <li>BE=4BF ⟹ F(3⁄2,0,0)，二面角 D-AF-B 的余弦值 = <b>√19⁄38</b>≈0.115（约 83.4°）。</li></ul>`;
  fitScene(s); s.center=[1,0.85,1]; s.rad=1.85;   // 固定视野，拖滑块时不跳动
  return s;
}

/* ============ 绘制 ============ */
const SCENES=[{k:'q8',n:'第 8 题',t:'正四面体的外接球与过 E 的最小截面',f:scene8,cam:{yaw:-0.75,pitch:0.42}},
              {k:'q11',n:'第 11 题',t:'正四棱锥中的平行、垂直与外接球',f:scene11,cam:{yaw:-0.70,pitch:0.30}},
              {k:'q16',n:'第 16 题',t:'DF∥平面 EAB 与点 C 到平面 BDE 的距离',f:scene16,cam:{yaw:-1.05,pitch:0.28}},
              {k:'q19',n:'第 19 题',t:'翻折：DG⊥平面 ABE 与二面角 D-AF-B',f:scene19,cam:{yaw:-1.25,pitch:0.38}}];
let cur=0, S=null, on={};

function build(){
  S=SCENES[cur].f();
  document.getElementById('qname').textContent=SCENES[cur].n+'　'+SCENES[cur].t;
  document.getElementById('facts').innerHTML=S.facts;
  const gb=document.getElementById('groups'); gb.innerHTML='';
  Object.entries(S.groups).forEach(([k,v])=>{
    if(on[SCENES[cur].k+k]===undefined) on[SCENES[cur].k+k]=!!v[2];
    const l=document.createElement('label'); l.className='chk';
    l.innerHTML=`<input type="checkbox" ${on[SCENES[cur].k+k]?'checked':''}>
      <span class="swatch" style="background:${v[1]}"></span><span>${v[0]}</span>`;
    l.querySelector('input').onchange=e=>{on[SCENES[cur].k+k]=e.target.checked;draw();};
    gb.appendChild(l);
  });
  document.getElementById('sliderBox').style.display = SCENES[cur].k==='q19'?'block':'none';
  draw();
}
const vis=g=>!g||on[SCENES[cur].k+g];

function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  ORIG=S.center; VIEW={cx:w/2,cy:h/2,S:Math.min(w,h)*0.42/S.rad*cam.scale};
  const items=[];
  S.faces.forEach(f=>{ if(!vis(f.g))return;
    const pp=f.p.map(proj); items.push({d:pp.reduce((a,p)=>a+p[2],0)/pp.length, type:'face', pp, c:f.c});});
  S.lines.forEach(l=>{ if(!vis(l.g))return;
    const a=proj(l.a),b=proj(l.b);
    items.push({d:(a[2]+b[2])/2-0.06, type:'line', a,b, c:l.c, w:l.w, dash:l.dash});});
  S.polys.forEach(p=>{ if(!vis(p.g))return;
    const pp=p.p.map(proj); items.push({d:pp.reduce((a,q)=>a+q[2],0)/pp.length-0.05, type:'poly', pp, c:p.c, w:p.w, fill:p.fill});});
  S.spheres.forEach(sp=>{ if(!vis(sp.g))return;
    const c=proj(sp.c); items.push({d:c[2]+sp.r+0.5, type:'ball', c, r:sp.r*VIEW.S, col:sp.col, fill:sp.fill});});
  items.sort((a,b)=>b.d-a.d);
  for(const it of items){
    ctx.setLineDash([]);
    if(it.type==='face'){
      ctx.beginPath(); it.pp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
      ctx.fillStyle=it.c; ctx.fill();
    }else if(it.type==='line'){
      if(it.dash)ctx.setLineDash(it.dash);
      ctx.beginPath(); ctx.moveTo(it.a[0],it.a[1]); ctx.lineTo(it.b[0],it.b[1]);
      ctx.strokeStyle=it.c; ctx.lineWidth=it.w||2; ctx.lineCap='round'; ctx.stroke();
    }else if(it.type==='poly'){
      ctx.beginPath(); it.pp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      if(it.fill){ctx.fillStyle=it.fill;ctx.fill();}
      ctx.strokeStyle=it.c; ctx.lineWidth=it.w||2; ctx.stroke();
    }else if(it.type==='ball'){
      ctx.beginPath(); ctx.arc(it.c[0],it.c[1],it.r,0,7);
      if(it.fill){ctx.fillStyle=it.fill;ctx.fill();}
      ctx.setLineDash([6,5]); ctx.strokeStyle=it.col; ctx.lineWidth=1.6; ctx.stroke(); ctx.setLineDash([]);
    }
  }
  S.pts.forEach(p=>{ if(!vis(p.g))return; const q=proj(p.p);
    ctx.beginPath(); ctx.arc(q[0],q[1],3.6,0,7); ctx.fillStyle=p.c; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();});
  ctx.font='600 14px "Times New Roman",system-ui,serif'; ctx.textAlign='center';
  S.labels.forEach(l=>{ if(!vis(l.g))return; const q=proj(l.p);
    ctx.lineWidth=3.4; ctx.strokeStyle='rgba(255,255,255,.92)';
    ctx.strokeText(l.t,q[0]+ (l.dx||10), q[1]+(l.dy||-9));
    ctx.fillStyle=l.c||'#1f2328'; ctx.fillText(l.t,q[0]+(l.dx||10), q[1]+(l.dy||-9));});
}

/* ============ 交互 ============ */
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,b:e.button};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{ if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.b===2){cam.panx+=dx;cam.pany+=dy;}
  else{cam.yaw+=dx*0.009; cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+dy*0.009));}
  draw();});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();
  cam.scale=Math.max(0.35,Math.min(4,cam.scale*(e.deltaY<0?1.1:0.9))); draw();},{passive:false});

document.getElementById('btnAll').onclick=()=>{Object.keys(S.groups).forEach(k=>on[SCENES[cur].k+k]=true);build();};
document.getElementById('btnNone').onclick=()=>{Object.keys(S.groups).forEach(k=>on[SCENES[cur].k+k]=false);build();};
function resetCam(){const c=SCENES[cur].cam;cam={yaw:c.yaw,pitch:c.pitch,scale:1,panx:0,pany:0};}
document.getElementById('btnReset').onclick=()=>{resetCam();draw();};
const bs=document.getElementById('btnSpin');
bs.onclick=()=>{spin=!spin;bs.classList.toggle('on',spin);};
document.getElementById('ang').oninput=e=>{fold=+e.target.value;
  document.getElementById('angVal').textContent=fold+'°'; S=scene19(); draw();};

const tabs=document.getElementById('tabs');
SCENES.forEach((s,i)=>{const d=document.createElement('div');d.className='tab'+(i===0?' on':'');
  d.textContent=s.n; d.onclick=()=>{cur=i;[...tabs.children].forEach((c,j)=>c.classList.toggle('on',j===i));
    resetCam();build();}; tabs.appendChild(d);});

function loop(){ if(spin){cam.yaw+=0.006;draw();} requestAnimationFrame(loop);}
resetCam(); build(); resize(); loop();
</script>
</body>
